# Este crate NO es un contrato para desplegar: solo compila los ejemplos de cada
# carpeta para garantizar que el código que mostramos en clase es correcto.
#   cargo test   → compila todo y corre los tests de tests/tests.rs
[package]
name = "soroban-basics"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false  # la carpeta 12-tests/ es material de clase, no tests de integración

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
